services:
  blog:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://waaogg.github.io}
        PUBLIC_WALINE_SERVER_URL: ${PUBLIC_WALINE_SERVER_URL:-}
    restart: unless-stopped
    ports:
      - "${BLOG_BIND:-127.0.0.1}:${BLOG_PORT:-8080}:80"
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [blog-net]
  waline-init:
    image: lizheming/waline:1.43.4@sha256:a0889757b9d0ffe4a6730440000e84ad0fe7ae93f572f93d03218390447c78c0
    profiles: [comments]
    restart: "no"
    network_mode: none
    entrypoint: [/bin/sh, -ec]
    command:
      - 'if [ -d /app/data/waline.sqlite ]; then echo "waline.sqlite must be a file; inspect existing storage before continuing" >&2; exit 1; fi; if [ ! -s /app/data/waline.sqlite ]; then cp /seed/waline.sqlite /app/data/waline.sqlite; fi'
    volumes:
      - ./deploy/waline/waline.sqlite:/seed/waline.sqlite:ro
      - waline-data:/app/data
    mem_limit: 64m
    cpus: 0.25
  waline:
    image: lizheming/waline:1.43.4@sha256:a0889757b9d0ffe4a6730440000e84ad0fe7ae93f572f93d03218390447c78c0
    profiles: [comments]
    depends_on:
      waline-init:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WALINE_PORT:-8360}:8360"
    environment:
      TZ: Asia/Shanghai
      SQLITE_PATH: /app/data
      JWT_TOKEN: ${WALINE_JWT_TOKEN:-}
      SITE_NAME: ${SITE_NAME:-日常之间}
      SITE_URL: ${PUBLIC_SITE_URL:-https://waaogg.github.io}
      SECURE_DOMAINS: ${WALINE_SECURE_DOMAINS:-waaogg.github.io}
      AUTHOR_EMAIL: ${AUTHOR_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SENDER: ${SMTP_SENDER:-}
    volumes:
      - waline-data:/app/data
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [blog-net]
networks:
  blog-net:
volumes:
  waline-data:

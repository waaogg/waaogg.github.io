services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astro-blog
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - blog-net

  waline:
    image: lizheming/waline:latest
    container_name: astro-waline
    restart: unless-stopped
    ports:
      - "8360:8360"
    environment:
      - SQLITE_PATH=/app/data/waline.sqlite
      - JWT_TOKEN=${WALINE_JWT_TOKEN:?Set WALINE_JWT_TOKEN in your local .env file}
    volumes:
      - ./waline-data:/app/data
    networks:
      - blog-net

networks:
  blog-net:
    driver: bridge
